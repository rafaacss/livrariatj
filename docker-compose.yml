services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: livrariatj_app
        restart: unless-stopped
        working_dir: /var/www
        volumes:
            - ./:/var/www
        networks:
            - livrariatj
        depends_on:
            - mysql
            - redis

    nginx:
        image: nginx:alpine
        container_name: symfony_nginx
        restart: unless-stopped
        ports:
            - "80:80"
        volumes:
            - ./:/var/www
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        networks:
            - livrariatj
        depends_on:
            - app

    mysql:
        image: mysql:8.0
        container_name: livrariatj_mysql
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: livrariatj
            MYSQL_USER: livrariatj
            MYSQL_PASSWORD: livrariatj
        ports:
            - "3306:3306"
        volumes:
            - mysql_data:/var/lib/mysql
            - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
        networks:
            - livrariatj
    redis:
        image: redis:alpine
        container_name: livrariatj_redis
        restart: unless-stopped
        ports:
            - "6379:6379"
        networks:
            - livrariatj

networks:
    livrariatj:
volumes:
    mysql_data:
