services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: livrariatj_app
        restart: unless-stopped
        working_dir: /var/www
        volumes:
            - ./:/var/www
        networks:
            - livrariatj
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_started


    nginx:
        image: nginx:alpine
        container_name: symfony_nginx
        restart: unless-stopped
        ports:
            - "80:80"
        volumes:
            - ./:/var/www
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        networks:
            - livrariatj
        depends_on:
            - app

    mysql:
        image: mysql:8.0
        container_name: livrariatj_mysql
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: livrariatj
            MYSQL_USER: livrariatj
            MYSQL_PASSWORD: livrariatj
            DATABASE_URL: "mysql://livrariatj:livrariatj@mysql:3306/livrariatj?serverVersion=8.0&charset=utf8mb4"
        healthcheck:
            test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ulivrariatj", "-plivrariatj" ]
            interval: 5s
            timeout: 5s
            retries: 30
            start_period: 30s
        ports:
            - "3306:3306"
            -
        volumes:
            - mysql_data:/var/lib/mysql
            - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
        networks:
            - livrariatj
    redis:
        image: redis:alpine
        container_name: livrariatj_redis
        restart: unless-stopped
        ports:
            - "6379:6379"
        networks:
            - livrariatj

networks:
    livrariatj:
volumes:
    mysql_data:
